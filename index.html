<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Os três coexistem: o par de SVG é o alvo e troca com o esquema do sistema, o .ico é a âncora de quem ignora `media` em rel=icon e o .png é o raster de quem não desenha SVG na aba. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/brand/marca-icone-noite.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/brand/marca-icone.svg"
      media="(prefers-color-scheme: light)"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <!--
      SEM viewport-fit=cover, de propósito. Ele pede ao iOS para desenhar a
      página POR BAIXO da interface do sistema, e devolver ao site a
      responsabilidade de recuar o que não pode ficar escondido — via
      env(safe-area-inset-*). Só que o inset de baixo mede o indicador de
      início, não a barra do Safari: num iPhone e num iPad, medida na captura,
      uma tarja de ~50pt cobria o fim da página, e o que caía ali não dava para
      alcançar rolando, porque a página se estende além do que se vê.

      Sem ele o iOS diagrama dentro da área segura e nada fica sob a interface.
      Os env(safe-area-inset-*) espalhados pelo CSS passam a valer 0, que já é
      o valor deles em qualquer navegador de mesa — nada muda de layout. As
      faixas do sistema ficam com a cor do papel (o background-color do html).

      Voltar a cobrir a tela toda exige aparelho iOS na mão para medir a
      compensação da barra; sem isso, o certo é não pedir a área.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#92500a" />
    <meta name="description" content="Estudo bíblico por perícopes. O texto é a Bíblia Livre; o material e a narração são de IA, e isso está dito." />
    <title>aiPericopes</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pericopes-theme')
          // DUPLICAÇÃO DELIBERADA de src/lib/theme.ts: o sépia foi
          // aposentado e migra para 'light'. Não deixe cair no ramo do
          // matchMedia abaixo — sépia era um tema CLARO, e quem o escolheu
          // acordaria no escuro. Mudou lá, mude aqui.
          if (t === 'sepia') t = 'light'
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = t
          var raw = localStorage.getItem('pericopes-reading')
          var prefs = raw ? JSON.parse(raw) : {}
          // DUPLICAÇÃO DELIBERADA de src/lib/reading-prefs.ts: este script roda
          // antes de qualquer bundle. Mudou lá, mude aqui.
          var steps = [1.02, 1.12, 1.22, 1.36, 1.5, 1.66]
          var step = typeof prefs.sizeStep === 'number' && prefs.sizeStep >= 0 && prefs.sizeStep < steps.length ? prefs.sizeStep : 2
          var fonts = {
            serif: "'EB Garamond Variable', Georgia, 'Times New Roman', serif",
            literata: "'Literata Variable', Georgia, serif",
            sans: "'Source Sans 3 Variable', system-ui, sans-serif",
          }
          var font = fonts[prefs.font] || fonts.serif
          var leadings = [1.5, 1.72, 1.8, 1.95]
          var lstep = typeof prefs.leadingStep === 'number' && prefs.leadingStep >= 0 && prefs.leadingStep < leadings.length ? prefs.leadingStep : 1
          var measures = { estreita: '32rem', media: '38rem', larga: '46rem' }
          var measure = measures[prefs.measure] || measures.media
          document.documentElement.style.setProperty('--read-size', steps[step] + 'rem')
          document.documentElement.style.setProperty('--read-font', font)
          document.documentElement.style.setProperty('--read-leading', String(leadings[lstep]))
          document.documentElement.style.setProperty('--read-measure', measure)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
